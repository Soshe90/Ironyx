    <text x="29" y="109" class="ui h1 ink">Progress</text><text x="30" y="139" class="ui small muted">Your consistency is adding up.</text>
    <rect x="25" y="166" width="380" height="47" rx="16" fill="#edf2ee"/><rect x="29" y="170" width="90" height="39" rx="13" fill="#fff"/><text x="74" y="195" text-anchor="middle" class="ui tiny teal" font-weight="700">4 WEEKS</text><text x="167" y="195" text-anchor="middle" class="ui tiny muted">3 MONTHS</text><text x="269" y="195" text-anchor="middle" class="ui tiny muted">6 MONTHS</text><text x="361" y="195" text-anchor="middle" class="ui tiny muted">ALL</text>
    <rect x="26" y="232" width="378" height="278" rx="23" fill="#fff" stroke="#e7eeea"/>
    <text x="49" y="270" class="ui label muted">TRAINING VOLUME</text><text x="49" y="308" class="ui num ink">8,420</text><text x="180" y="307" class="ui small muted">kg this week</text><rect x="321" y="249" width="61" height="27" rx="13" fill="#e3f5ee"/><text x="351" y="267" text-anchor="middle" class="ui tiny" fill="#16866e" font-weight="700">↑ 12%</text>
    <path d="M52 448 C80 427 93 440 116 404 S153 420 178 389 S217 414 242 367 S278 385 305 343 S344 366 378 326 L378 461 L52 461 Z" fill="url(#chart)"/>
    <path d="M52 448 C80 427 93 440 116 404 S153 420 178 389 S217 414 242 367 S278 385 305 343 S344 366 378 326" fill="none" stroke="#11a991" stroke-width="4" class="round"/>
    <path d="M51 350h327M51 395h327M51 440h327" stroke="#edf1ee" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="52" y="486" class="ui tiny muted">WEEK 1</text><text x="161" y="486" class="ui tiny muted">WEEK 2</text><text x="270" y="486" class="ui tiny muted">WEEK 3</text><text x="378" y="486" text-anchor="end" class="ui tiny muted">NOW</text>
    <text x="28" y="559" class="ui h2 ink">Strength highlights</text><text x="398" y="557" text-anchor="end" class="ui tiny teal" font-weight="700">See all</text>
    <rect x="26" y="580" width="378" height="75" rx="19" fill="#fff" stroke="#e7eeea"/><circle cx="62" cy="617" r="21" fill="#e0f3ef"/><path d="M53 621l6-8 5 4 7-10" fill="none" stroke="#0b887a" stroke-width="2.5" class="round"/><text x="98" y="611" class="ui small ink" font-weight="700">Bench press</text><text x="98" y="635" class="ui tiny muted">Estimated 1RM</text><text x="377" y="616" text-anchor="end" class="ui body ink" font-weight="750">82.5 kg</text><text x="377" y="637" text-anchor="end" class="ui tiny" fill="#16866e">+5 kg</text>
    <rect x="26" y="668" width="378" height="61" rx="19" fill="#eaf5f1"/><text x="49" y="694" class="ui tiny teal" font-weight="700">CONSISTENCY</text><text x="49" y="715" class="ui small ink" font-weight="650">3 workouts this week · You’re on track</text>
    <path d="M28 746h374" class="line"/><g class="ui tiny" text-anchor="middle"><text x="59" y="772" fill="#85928f">⌂</text><text x="59" y="788" fill="#85928f">Home</text><text x="163" y="772" fill="#85928f">▤</text><text x="163" y="788" fill="#85928f">Tracker</text><text x="267" y="772" fill="#85928f">◈</text><text x="267" y="788" fill="#85928f">Library</text><text x="371" y="772" fill="#08796f" font-weight="700">◷</text><text x="371" y="788" fill="#08796f">Progress</text></g>
  </g>
  <text x="800" y="1040" text-anchor="middle" class="ui tiny" fill="#71817d">Concept only · Existing app behavior and navigation remain unchanged unless approved</text>
