<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Ironyx modern restyle concept</title>
  <desc id="desc">Three phone-screen concepts for a modern workout app: dashboard, active workout, and progress, using an ink, warm ivory, and vivid teal palette.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#092f32"/><stop offset="1" stop-color="#126d68"/></linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26c7b1" stop-opacity=".28"/><stop offset="1" stop-color="#26c7b1" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-15%" width="140%" height="145%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#173b3b" flood-opacity=".14"/></filter>
    <style>
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}.ink{fill:#172d2c}.muted{fill:#788987}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.label{font-size:14px;font-weight:700;letter-spacing:.5px}.h1{font-size:30px;font-weight:750;letter-spacing:-.8px}.h2{font-size:22px;font-weight:700;letter-spacing:-.3px}.num{font-size:34px;font-weight:750;letter-spacing:-1px}.white{fill:#fff}.teal{fill:#0d776e}.surface{fill:#fff}.bg{fill:#f3f6f2}.line{stroke:#e7eeea;stroke-width:1.5}.round{stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#edf2ed"/>
  <text x="800" y="72" text-anchor="middle" class="ui" font-size="15" font-weight="750" letter-spacing="3" fill="#0b756c">IRONYX · VISUAL CONCEPT</text>
  <text x="800" y="126" text-anchor="middle" class="ui" font-size="38" font-weight="750" letter-spacing="-1.1" fill="#172d2c">Training, with a little more intention.</text>
  <text x="800" y="159" text-anchor="middle" class="ui" font-size="17" fill="#71817d">A calmer, sharper direction — confident typography, useful contrast, and less visual noise.</text>
  <!-- Dashboard -->
  <g transform="translate(95 205)" filter="url(#shadow)">
    <rect width="430" height="790" rx="38" fill="#fbfcf9"/>
    <rect x="0" y="0" width="430" height="790" rx="38" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="32" y="48" class="ui tiny muted">9:41</text><text x="358" y="48" class="ui tiny muted">● ● ▰</text>
    <text x="30" y="103" class="ui h1 ink">Good morning,</text><text x="30" y="139" class="ui h1 ink">Alex.</text>
    <circle cx="372" cy="105" r="25" fill="#e1f3ef"/><text x="372" y="112" text-anchor="middle" class="ui body teal" font-weight="700">A</text>
    <text x="30" y="178" class="ui small muted">Small steps. Stronger every week.</text>
    <rect x="24" y="207" width="382" height="196" rx="27" fill="url(#hero)"/>
    <circle cx="351" cy="247" r="30" fill="#ffffff" fill-opacity=".09"/><path d="M340 247h22M351 236v22" stroke="#80e5d6" stroke-width="3" class="round"/>
    <text x="48" y="249" class="ui label" fill="#a2e5dc">TODAY · MON, JUN 16</text>
    <text x="48" y="295" class="ui" font-size="26" font-weight="700" fill="#fff">Your next session</text>
    <text x="48" y="325" class="ui small" fill="#c3dfd9">Upper body · about 45 min</text>
    <rect x="48" y="348" width="151" height="38" rx="19" fill="#b8f2e6"/><text x="123" y="373" text-anchor="middle" class="ui small" font-weight="700" fill="#103d38">Start workout  →</text>
    <text x="28" y="449" class="ui h2 ink">This week</text><text x="365" y="447" text-anchor="end" class="ui small teal" font-weight="700">2 of 3</text>
    <rect x="27" y="465" width="376" height="105" rx="22" fill="#fff" stroke="#e7eeea"/>
    <text x="49" y="496" class="ui label muted">WEEKLY GOAL</text><text x="49" y="540" class="ui" font-size="29" font-weight="750" fill="#172d2c">2 <tspan font-size="17" fill="#788987" font-weight="500">/ 3 sessions</tspan></text>
    <rect x="239" y="514" width="137" height="9" rx="5" fill="#e7eeea"/><rect x="239" y="514" width="91" height="9" rx="5" fill="#18a996"/>
    <text x="28" y="619" class="ui h2 ink">Your momentum</text><text x="402" y="617" text-anchor="end" class="ui tiny muted">LAST 7 DAYS</text>
    <rect x="27" y="638" width="376" height="91" rx="22" fill="#fff" stroke="#e7eeea"/>
    <text x="49" y="675" class="ui" font-size="27" font-weight="750" fill="#172d2c">8,420</text><text x="49" y="700" class="ui tiny muted">kg volume</text>
    <path d="M224 698 C245 687 253 690 268 675 S290 682 304 660 S330 675 346 651 S371 658 383 644" fill="none" stroke="#0ca995" stroke-width="4" class="round"/>
    <rect x="0" y="746" width="430" height="44" rx="0" fill="#fbfcf9"/><path d="M28 746h374" class="line"/>
    <g class="ui tiny" text-anchor="middle"><text x="59" y="772" fill="#08796f" font-weight="700">⌂</text><text x="59" y="788" fill="#08796f">Home</text><text x="163" y="772" fill="#85928f">▤</text><text x="163" y="788" fill="#85928f">Tracker</text><text x="267" y="772" fill="#85928f">◈</text><text x="267" y="788" fill="#85928f">Library</text><text x="371" y="772" fill="#85928f">◷</text><text x="371" y="788" fill="#85928f">Progress</text></g>
  </g>
  <!-- Active workout -->
  <g transform="translate(585 205)" filter="url(#shadow)">
    <rect width="430" height="790" rx="38" fill="#fbfcf9"/><rect width="430" height="790" rx="38" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="30" y="48" class="ui tiny muted">9:41</text><text x="358" y="48" class="ui tiny muted">● ● ▰</text>
