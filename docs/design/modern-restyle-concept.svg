    <text x="29" y="320" class="ui h2 ink">Bench press</text><text x="29" y="345" class="ui small muted">Barbell · Chest</text><text x="395" y="328" text-anchor="end" class="ui tiny teal" font-weight="700">Last time ↗</text>
    <rect x="25" y="365" width="380" height="231" rx="23" fill="#fff" stroke="#e7eeea"/>
    <rect x="25" y="365" width="380" height="46" rx="23" fill="#f5f8f5"/><text x="54" y="394" class="ui tiny muted" font-weight="700">SET</text><text x="146" y="394" class="ui tiny muted" font-weight="700">WEIGHT</text><text x="252" y="394" class="ui tiny muted" font-weight="700">REPS</text><text x="350" y="394" class="ui tiny muted" font-weight="700">DONE</text>
    <path d="M25 411h380M25 472h380M25 533h380" class="line"/>
    <g class="ui body ink"><text x="56" y="450">1</text><text x="56" y="511">2</text><text x="56" y="572">3</text></g>
    <g fill="#f2f6f3"><rect x="115" y="421" width="91" height="39" rx="12"/><rect x="115" y="482" width="91" height="39" rx="12"/><rect x="115" y="543" width="91" height="39" rx="12"/><rect x="229" y="421" width="75" height="39" rx="12"/><rect x="229" y="482" width="75" height="39" rx="12"/><rect x="229" y="543" width="75" height="39" rx="12"/></g>
    <g class="ui small ink" text-anchor="middle"><text x="160" y="446">60 kg</text><text x="160" y="507">60 kg</text><text x="160" y="568">— kg</text><text x="266" y="446">10</text><text x="266" y="507">8</text><text x="266" y="568">—</text></g>
    <g fill="#16a28e"><circle cx="354" cy="440" r="14"/><circle cx="354" cy="501" r="14"/></g><path d="m348 440 4 4 8-9m-12 66 4 4 8-9" fill="none" stroke="#fff" stroke-width="2" class="round"/><circle cx="354" cy="562" r="14" fill="#fff" stroke="#cbd8d2" stroke-width="2"/>
    <rect x="27" y="616" width="377" height="51" rx="16" fill="#fff" stroke="#dfe9e4"/><text x="215" y="648" text-anchor="middle" class="ui small teal" font-weight="700">＋ Add set</text>
    <rect x="26" y="686" width="378" height="58" rx="18" fill="#0b756c"/><text x="215" y="722" text-anchor="middle" class="ui body white" font-weight="700">Save exercise</text>
    <text x="215" y="774" text-anchor="middle" class="ui tiny muted">Set-by-set. Focused. Easy to scan mid-workout.</text>
  </g>
  <!-- Progress -->
  <g transform="translate(1075 205)" filter="url(#shadow)">
    <rect width="430" height="790" rx="38" fill="#fbfcf9"/><rect width="430" height="790" rx="38" fill="none" stroke="#fff" stroke-width="5"/>
